name: publish

on:
  # Fires automatically when a GitHub Release is published (e.g. via
  # `gh release create vX.Y.Z`). The tag carried by the release is the
  # ref we build + verify + publish.
  release:
    types: [published]
  # Manual fallback: publish an already-existing release tag.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish, for example v0.7.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-build:
    name: verify and build
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-ref.outputs.release_tag }}
    steps:
      - name: Resolve release ref
        id: release-ref
        shell: bash
        run: |
          # Version-agnostic: never hard-code a version here. On a release
          # event the tag is GITHUB_REF_NAME; on workflow_dispatch it is the
          # supplied input.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="${{ inputs.release_tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release ref must look like vX.Y.Z; got ${release_tag}" >&2
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-ref.outputs.release_tag }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build, test, and MCP tooling
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev,mcp]"

      - name: Verify version is self-consistent and matches the tag
        shell: bash
        run: |
          # Single source of truth: read the version from pyproject.toml.
          pyproject_version="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          init_version="$(python -c "import mini_omega_lock; print(mini_omega_lock.__version__)")"
          # 1. __init__.__version__ must match pyproject (always).
          if [[ "${init_version}" != "${pyproject_version}" ]]; then
            echo "mini_omega_lock.__version__ ${init_version} != pyproject.toml ${pyproject_version}" >&2
            exit 1
          fi
          # 2. On a release/dispatch event the tag must equal v<version>.
          tag="${{ steps.release-ref.outputs.release_tag }}"
          expected_tag="v${pyproject_version}"
          if [[ "${tag}" != "${expected_tag}" ]]; then
            echo "Release tag ${tag} != v<version> ${expected_tag} (pyproject version ${pyproject_version})" >&2
            exit 1
          fi
          echo "Version ${pyproject_version} matches pyproject.toml, mini_omega_lock.__version__, and tag ${tag}."

      - name: Run deterministic verification
        run: |
          python -m pytest -q
          python scripts/generate_readme_claims.py --check
          python scripts/check_repo_consistency.py
          python examples/demo_replay.py
          python scripts/run_golden_cases.py --check
          python scripts/verify_fixture_integrity.py
          # release_audit.py is intentionally NOT a separate step here: it runs via
          # publish_readiness.py below (and in ci.yml on push/PR). Its pre-tag
          # "tag already exists" check is skipped only in the Publish readiness gate
          # step, which sets MINI_OMEGA_LOCK_RELEASE_WORKFLOW for that step alone.

      - name: Build distributions
        run: python -m build

      - name: Smoke install built wheel
        run: python scripts/wheel_smoke_install.py dist/*.whl

      - name: Publish readiness gate
        # release_audit (run by publish_readiness) checks out AT the tag, where its
        # pre-tag "tag already exists" guard must be skipped. Scope the env to THIS
        # step only, so the deterministic-verification pytest step above still runs
        # the guard at full strength.
        env:
          MINI_OMEGA_LOCK_RELEASE_WORKFLOW: "1"
        run: python scripts/publish_readiness.py --no-network

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.release-ref.outputs.release_tag }}
          path: dist/mini_omega_lock-*
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: verify-build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.verify-build.outputs.release_tag }}
          path: dist

      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
